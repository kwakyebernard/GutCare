<!DOCTYPE html>
<html>
<head>
    <title>GutCare - Home</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="navbar">
        <h2>GutCare Tracker</h2>

        <div class="dropdown">
            <span style="cursor:pointer;">Services ▾</span>
            <div class="dropdown-content">
                <a href="patient-register.html">Patient Registration</a>
                <a href="staff-login.html">Staff Login</a>
                <a href="symptom-tracker.html">Symptom Tracker</a>
                <a href="meal-log.html">Meal Log</a>
                <a href="stool-log.html">Stool Tracking</a>
                <a href="appointments.html">Appointments</a>
                <a href="reports.html">Health Reports</a>
                <a href=“dashboard.html”>GutCare dashboard</a>
            </div>
        </div>
    </div>

    <h2 style="text-align:center; margin-top:20px;">Welcome to GutCare</h2>

    <div class="hero-images">
        <img src="https://i.imgur.com/YOPe1qv.jpeg" alt="Gut Illustration">
        <img src="https://i.imgur.com/KkOJco2.jpeg" alt="Endoscopy">
        <img src="https://i.imgur.com/iF3jBwD.jpeg" alt="Healthy Meals">
    </div>

    <script>
        function toggleServices() {
            document.getElementById("servicesMenu").classList.toggle("show");
        }

        window.onclick = function(event) {
            if (!event.target.matches('.dropbtn')) {
                let dropdowns = document.getElementsByClassName("dropdown-content");
                for (let i = 0; i < dropdowns.length; i++) {
                    dropdowns[i].classList.remove("show");
                }
            }
        }
    </script>
</body>
</html>
