<!DOCTYPE html>
<html>
<head>
    <title>Stool Log - GutCare</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="navbar">Stool Tracking</div>

    <form style="padding:20px;">
        <label>Bristol Stool Type (1–7)</label><br>
        <input type="number" min="1" max="7" style="width:100%; padding:10px;"><br><br>

        <label>Additional Notes</label><br>
        <textarea style="width:100%; height:120px;"></textarea><br><br>

        <button style="padding:10px 15px; background:#0d6efd; color:white;">Save Entry</button>
    </form>

    <script>
    document.querySelector("button").addEventListener("click", function(e) {
        e.preventDefault();

        let type = document.querySelector("input").value;
        let notes = document.querySelector("textarea").value;

        let data = {
            type: type,
            notes: notes,
            date: new Date().toLocaleString()
        };

        localStorage.setItem("gutcare_stool", JSON.stringify(data));
        alert("Stool entry saved!");
    });
</script>
</body>
</html>
