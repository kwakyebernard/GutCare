<!DOCTYPE html>
<html>
<head>
    <title>Patient Registration - GutCare</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="navbar">Patient Registration</div>

    <form style="padding: 20px;">
        <label>Full Name</label><br>
        <input type="text" style="width:100%; padding:10px;"><br><br>

        <label>Age</label><br>
        <input type="number" style="width:100%; padding:10px;"><br><br>

        <label>Phone Number</label><br>
        <input type="text" style="width:100%; padding:10px;"><br><br>

        <label>Email</label><br>
        <input type="email" style="width:100%; padding:10px;"><br><br>

        <label>Medical Condition / Symptoms</label><br>
        <textarea style="width:100%; height:120px;"></textarea><br><br>

        <button style="padding:10px 15px; background:#0d6efd; color:white;">Register</button>
    </form>
</body>
</html>
