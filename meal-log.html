<!DOCTYPE html>
<html>
<head>
    <title>Meal Log - GutCare</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="navbar">Meal Log</div>

    <form style="padding:20px;">
        <label>Meal Description</label><br>
        <textarea style="width:100%; height:120px;"></textarea><br><br>

        <label>Time Eaten</label><br>
        <input type="time" style="width:100%; padding:10px;"><br><br>

        <button style="padding:10px 15px; background:#0d6efd; color:white;">Save Meal</button>
    </form>

    <script>
    document.querySelector("button").addEventListener("click", function(e) {
        e.preventDefault();

        let meal = document.querySelector("textarea").value;
        let time = document.querySelector("input").value;

        let data = {
            meal: meal,
            time: time,
            date: new Date().toLocaleString()
        };

        localStorage.setItem("gutcare_meal", JSON.stringify(data));
        alert("Meal saved!");
    });
</script></body>
</html>
