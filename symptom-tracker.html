<!DOCTYPE html>
<html>
<head>
    <title>Symptom Tracker - GutCare</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="navbar">Symptom Tracker</div>

    <form style="padding:20px;">
        <label>Symptoms Today</label><br>
        <textarea style="width:100%; height:120px;"></textarea><br><br>

        <label>Pain Level (1–10)</label><br>
        <input type="number" min="1" max="10" style="width:100%; padding:10px;"><br><br>

        <button style="padding:10px 15px; background:#0d6efd; color:white;">
            Save Entry
        </button>
    </form>

    <script>
    document.querySelector("button").addEventListener("click", function(e) {
        e.preventDefault();

        let symptoms = document.querySelector("textarea").value;
        let pain = document.querySelector("input").value;

        let data = {
            symptoms: symptoms,
            pain: pain,
            date: new Date().toLocaleString()
        };

        localStorage.setItem("gutcare_symptoms", JSON.stringify(data));
        alert("Symptoms saved!");
    });
</script>
</body>
</html>
