<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GutCare | Staff Login</title>
  <link rel="stylesheet" href="staff-login.css">
</head>
<body>

  <div class="login-container">
    <h2>GutCare Tracker</h2>
    <p>Staff Login</p>

    <form id="loginForm">
      <input type="text" id="staffId" placeholder="Staff ID" required>
      <input type="password" id="password" placeholder="Password" required>

      <button type="submit">Login</button>
    </form>

    <small id="errorMsg"></small>
  </div>

</body>

  <script>

    document.getElementById("loginForm").addEventListener("submit", function (e) {
  e.preventDefault();

  const staffId = document.getElementById("staffId").value;
  const password = document.getElementById("password").value;
  const errorMsg = document.getElementById("errorMsg");

  // Demo credentials (replace with backend later)
  if (staffId === "Staff001" && password === "GutCare001") {

    // Save staff info for dashboard
    localStorage.setItem("staffName", "John Mensah");
    localStorage.setItem("staffRole", "Nutritionist");

    window.location.href = "staff-dashboard.html";
  } else {
    errorMsg.textContent = "Invalid Staff ID or Password";
  }
});
    
  </script>
  
</html>
